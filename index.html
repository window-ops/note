<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Note</title>
  <link rel="stylesheet" href="./css/default.css">
  <script src="./js/functions.js"></script>
  <script src="https://miculpionier.ro/js/contextMenu_Project.js"></script>
</head>
<body>
  <div class="container-fluid">
    <div class="card top">
      <div class="card-body">
        <textarea class="form-control" id="note" rows="20"></textarea>
      </div>
    </div>
    <div class="card bottom">
      <div class="card-body">
        <div class="btn-group btn-group-justified d-flex">
         <button class="btn btn-primary" onclick="saveNote()">Save</button>
         <button class="btn btn-secondary" onclick="clearNote()">Clear</button>
        </div>
      </div>
    </div>
  </div>
</body>
