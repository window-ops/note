<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Note</title>
  <link rel="stylesheet" href="./css/cosmo.css">
  <script src="./js/functions.js"></script>
</head>
<body data-bs-theme="light">
  <div class="main-content">
    <div class="card top">
      <div class="card-body">
        <textarea class="form-control" id="note" rows="20"></textarea>
      </div>
    </div>
    <div class="card bottom">
      <div class="card-body">
        <div class="row">
          <div class="col-md">
            <button class="btn btn-primary btn-upper w-100" onclick="saveNote()">Save</button>
          </div>
          <div class="col-md">
            <button class="btn btn-secondary w-100" onclick="clearNote()">Clear</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const themeSwitcher = document.getElementById('theme-switcher');
    // Toggle the theme on switcher change
    themeSwitcher.addEventListener('change', () => {
      const currentTheme = document.body.getAttribute('data-bs-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-bs-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
    // Apply saved theme on page load
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.body.setAttribute('data-bs-theme', savedTheme);
      themeSwitcher.checked = savedTheme === 'dark';
    } else {
      // If no theme is saved, default to light theme
      document.body.setAttribute('data-bs-theme', 'light');
    }
  </script>
</body>
